<aside class="sidebar" [class.hidden]="layoutService.isHidden"
       [style.width.px]="layoutService.sidebarWidth">

  <div class="sidebar-logo">
    <img src="assets/logo.jpg" class="sidebar-logo-img" alt="StockMaster Logo">
    <div class="sidebar-logo-text" style="flex: 1;">
      <span class="logo-name">StockMaster</span>
      <span class="logo-version">ERP</span>
    </div>
    
    <button class="sidebar-close-btn" (click)="layoutService.toggleSidebar()" [title]="'COMMON.CLOSE_SIDEBAR' | translate" [attr.aria-label]="'COMMON.CLOSE_SIDEBAR' | translate">
      <lucide-icon [img]="icons.X" [size]="18"></lucide-icon>
    </button>
  </div>

  <nav class="sidebar-nav">
    <span class="sidebar-section-label">{{ 'SIDEBAR.NAVIGATION' | translate }}</span>

    <a *ngFor="let item of filteredMenuItems"
       [routerLink]="item.route"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: item.route === '/'}"
       class="sidebar-link">
      <span class="sidebar-link-icon" [style.color]="item.color">
        <lucide-icon [img]="item.icon" [size]="18"></lucide-icon>
      </span>
      <span class="sidebar-link-label">{{ item.label | translate }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-user" routerLink="/profile" style="cursor: pointer;" [title]="'COMMON.MY_PROFILE' | translate">
      <div class="avatar" style="width: 34px; height: 34px; font-size: 13px; padding: 0; overflow: hidden;">
        <img *ngIf="dbProfile?.profilePicture" [src]="dbProfile.profilePicture" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">
        <span *ngIf="!dbProfile?.profilePicture" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
          {{ userName.charAt(0).toUpperCase() }}
        </span>
      </div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name">{{ userName }}</span>
        <span class="sidebar-user-role">{{ getRoleKey(userRole) | translate }}</span>
      </div>
    </div>
    <button class="sidebar-logout-btn" (click)="logout()">
      <lucide-icon [img]="icons.LogOut" [size]="16"></lucide-icon>
      <span>{{ 'COMMON.LOGOUT' | translate }}</span>
    </button>
  </div>

  <div class="sidebar-resize-handle" (mousedown)="onResizeStart($event)"></div>
</aside>
