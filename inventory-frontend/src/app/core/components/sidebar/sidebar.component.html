<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <lucide-icon name="boxes" [size]="22"></lucide-icon>
    </div>
    <div class="sidebar-logo-text">
      <span class="logo-name">InvManager</span>
      <span class="logo-version">v2.0</span>
    </div>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">
    <span class="sidebar-section-label">NAVIGATION</span>
    
    <a *ngFor="let item of menuItems" 
       [routerLink]="item.route" 
       routerLinkActive="active" 
       [routerLinkActiveOptions]="{exact: item.route === '/'}"
       class="sidebar-link">
      <span class="sidebar-link-icon">
        <lucide-icon [name]="item.icon" [size]="18"></lucide-icon>
      </span>
      <span class="sidebar-link-label">{{ item.label }}</span>
    </a>
  </nav>

  <!-- User profile -->
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="avatar" style="width: 34px; height: 34px; font-size: 13px;">
        A
      </div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name">Admin</span>
        <span class="sidebar-user-role">Manager</span>
      </div>
    </div>
    <button class="sidebar-logout-btn" title="Logout" (click)="logout()">
      <lucide-icon name="log-out" [size]="16"></lucide-icon>
      <span>Logout</span>
    </button>
  </div>
</aside>
