<header class="header">
  
  <div class="header-left">
    <button class="header-menu-btn" aria-label="Toggle sidebar" (click)="layoutService.toggleSidebar()">
      <lucide-icon [img]="icons.Menu" [size]="20"></lucide-icon>
    </button>
    <h1 class="header-title">{{ pageTitle | translate }}</h1>
  </div>

  <div class="header-right">
    
    <button class="header-icon-btn" [title]="'LANGUAGES.' + currentLang.toUpperCase() | translate" (click)="switchLang()">
      <lucide-icon [img]="icons.Globe" [size]="18" style="color: #3b82f6;"></lucide-icon>
      <span class="header-lang-label">{{ currentLang === 'en' ? 'AR' : 'EN' }}</span>
    </button>

    <button class="header-icon-btn" [title]="isDarkMode ? ('COMMON.LIGHT_MODE' | translate) : ('COMMON.DARK_MODE' | translate)" (click)="toggleTheme()">
      <lucide-icon [img]="isDarkMode ? icons.Sun : icons.Moon" [size]="18" style="color: #f59e0b;"></lucide-icon>
    </button>

        <div class="position-relative">
      <button class="header-icon-btn theme-btn" title="Themes" (click)="toggleThemesMenu()">
        <lucide-icon [img]="icons.Palette" [size]="18" style="color: #ec4899;"></lucide-icon>
      </button>

      <div *ngIf="showThemes" class="themes-dropdown shadow-lg">
        <div class="themes-header">
          <h6>Themes</h6>
        </div>
        <div class="themes-body">
          <div *ngFor="let scheme of availableSchemes"
               class="theme-swatch"
               [ngClass]="{'active': currentScheme === scheme.id}"
               (click)="selectTheme(scheme.id)">
            <div class="color-circle" [style.backgroundColor]="scheme.color"></div>
            <span>{{ scheme.name }}</span>
            <lucide-icon *ngIf="currentScheme === scheme.id" [img]="icons.Check" [size]="14" class="check-icon"></lucide-icon>
          </div>
        </div>
      </div>
    </div>

    <div class="position-relative">
      <button class="header-icon-btn header-notif-btn" [title]="'COMMON.NOTIFICATIONS' | translate" (click)="toggleNotifications()">
        <lucide-icon [img]="icons.Bell" [size]="18" style="color: #10b981;"></lucide-icon>
        <span *ngIf="unreadNotificationsCount > 0" class="header-badge">{{ unreadNotificationsCount }}</span>
      </button>

      <div *ngIf="showNotifications" class="notif-dropdown shadow-lg">
        <div class="notif-header">
          <h6>{{ 'COMMON.NOTIFICATIONS' | translate }}</h6>
          <button *ngIf="unreadNotificationsCount > 0" class="btn-mark-all" (click)="markAllRead()">
            <lucide-icon [img]="icons.Check" [size]="12"></lucide-icon>
            {{ 'COMMON.MARK_ALL_READ' | translate }}
          </button>
        </div>
        <div class="notif-body">
          <div *ngIf="notificationsList.length === 0" class="notif-item empty">
            {{ 'DASHBOARD.NO_DATA' | translate }}
          </div>
          <div *ngFor="let item of notificationsList"
               class="notif-item"
               [ngClass]="{ 'unread': !item.isRead }"
               (click)="navigateFromNotification(item)"
               style="cursor: pointer;">
            <div class="notif-indicator" [ngClass]="item.type.toLowerCase() || 'info'"></div>
            <div class="notif-content-wrapper">
              <div class="notif-item-title">{{ item.title }}</div>
              <div class="notif-item-desc">{{ item.message }}</div>
              <span class="notif-time">{{ item.createdAt | date:'short' }}</span>
            </div>
            <div class="notif-actions">
              <button *ngIf="!item.isRead" class="notif-action-btn" (click)="markAsRead(item.id, $event)" [title]="'COMMON.MARK_AS_READ' | translate">
                <lucide-icon [img]="icons.Check" [size]="14"></lucide-icon>
              </button>
              <button class="notif-action-btn delete" (click)="deleteNotification(item.id, $event)" [title]="'COMMON.DELETE' | translate">
                <lucide-icon [img]="icons.Trash" [size]="12"></lucide-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="header-user" routerLink="/profile" style="cursor:pointer;" title="My Profile">
      <div class="avatar">
        {{ userName.charAt(0).toUpperCase() }}
      </div>
      <div class="header-user-info">
        <span class="header-user-name">{{ userName }}</span>
        <span class="header-user-role">{{ userRole }}</span>
      </div>
    </div>
  </div>
</header>
