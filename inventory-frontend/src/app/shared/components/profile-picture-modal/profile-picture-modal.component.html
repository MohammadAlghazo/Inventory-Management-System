<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="bg-base-100 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-base-content/10 flex flex-col">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-base-content/10 flex justify-between items-center bg-base-200/50">
      <h3 class="text-lg font-semibold text-base-content">{{ title | translate }}</h3>
      <button (click)="cancel()" class="btn btn-ghost btn-sm btn-square hover:bg-error hover:text-error-content rounded-full transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 flex flex-col gap-4">
      <div *ngIf="uploadError" class="alert alert-error text-sm rounded-lg py-2">
        <span>{{ uploadError }}</span>
      </div>

      <!-- File Input -->
      <div class="form-control w-full">
        <label class="label"><span class="label-text font-medium">Select Image</span></label>
        <input type="file" class="file-input file-input-bordered file-input-primary w-full" 
               (change)="fileChangeEvent($event)" accept="image/*" />
      </div>

      <!-- Cropper Area -->
      <div *ngIf="imageChangedEvent" class="w-full bg-base-200 rounded-xl overflow-hidden border border-base-content/10 flex justify-center items-center p-2" style="height: 300px;">
        <image-cropper
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="true"
            [aspectRatio]="1 / 1"
            format="png"
            (imageCropped)="imageCropped($event)"
            (imageLoaded)="imageLoaded()"
            (cropperReady)="cropperReady()"
            (loadImageFailed)="loadImageFailed()"
            class="max-h-full max-w-full">
        </image-cropper>
      </div>
      
      <div *ngIf="!imageChangedEvent" class="w-full bg-base-200 rounded-xl border border-dashed border-base-content/20 flex flex-col justify-center items-center p-8 text-base-content/50 h-[300px]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <p class="text-sm">Select an image to preview and crop</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-base-200/50 border-t border-base-content/10 flex justify-end gap-3">
      <button (click)="cancel()" class="btn btn-ghost rounded-xl" [disabled]="isUploading">Cancel</button>
      <button (click)="upload()" class="btn btn-primary rounded-xl" [disabled]="!croppedImage || isUploading">
        <span *ngIf="isUploading" class="loading loading-spinner loading-sm"></span>
        <span *ngIf="!isUploading">Upload Picture</span>
      </button>
    </div>
  </div>
</div>
