<div class="custom-modal-overlay" (click)="cancel()">
  <div class="custom-modal" style="max-width: 500px; display: flex; flex-direction: column;" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="custom-modal-header">
      <h3 class="custom-modal-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline; margin-right: 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        {{ title | translate }}
      </h3>
    </div>

    <!-- Body -->
    <div class="custom-modal-body" style="overflow-y: auto; flex: 1;">
      <div *ngIf="uploadError" style="padding: 12px; border-radius: 8px; background-color: rgba(239, 68, 68, 0.1); color: var(--error); margin-bottom: 16px; font-size: 14px;">
        <span>{{ uploadError }}</span>
      </div>

      <!-- File Input -->
      <div class="form-group">
        <label class="form-label">{{ 'COMMON.SELECT_IMAGE' | translate }}</label>
        <input type="file" class="form-input" (change)="fileChangeEvent($event)" accept="image/*" />
      </div>

      <!-- Cropper Area -->
      <div *ngIf="imageChangedEvent" style="width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; padding: 8px; height: 300px; background-color: var(--bg-body);">
        <image-cropper
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="true"
            [aspectRatio]="1 / 1"
            format="png"
            (imageCropped)="imageCropped($event)"
            (imageLoaded)="imageLoaded()"
            (cropperReady)="cropperReady()"
            (loadImageFailed)="loadImageFailed()"
            style="max-height: 100%; max-width: 100%;">
        </image-cropper>
      </div>
      
      <div *ngIf="!imageChangedEvent" style="width: 100%; border-radius: 12px; border: 2px dashed var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px; color: var(--text-muted); height: 300px; background-color: var(--bg-body);">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" style="margin-bottom: 16px; opacity: 0.5;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <p style="font-size: 14px;">{{ 'COMMON.IMAGE_PREVIEW_HINT' | translate }}</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="custom-modal-footer">
      <button (click)="cancel()" class="btn btn-ghost" [disabled]="isUploading">{{ 'COMMON.CANCEL' | translate }}</button>
      <button (click)="upload()" class="btn btn-primary" [disabled]="!croppedImage || isUploading">
        <span *ngIf="isUploading" class="spinner"></span>
        <span *ngIf="!isUploading">{{ 'COMMON.UPLOAD_PICTURE' | translate }}</span>
      </button>
    </div>
  </div>
</div>
