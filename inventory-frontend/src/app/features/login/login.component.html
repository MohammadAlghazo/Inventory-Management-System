<div class="login-page">
  <!-- Animated background -->
  <div class="login-bg">
    <div class="login-bg-orb orb-1"></div>
    <div class="login-bg-orb orb-2"></div>
    <div class="login-bg-orb orb-3"></div>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">
        <lucide-icon name="boxes" [size]="28"></lucide-icon>
      </div>
      <div>
        <h2 class="login-logo-name">InvManager</h2>
        <p class="login-logo-sub">Inventory Management System</p>
      </div>
    </div>

    <!-- Title -->
    <div class="login-header">
      <h1 class="login-title">Welcome Back!</h1>
      <p class="login-subtitle">Sign in to manage your inventory</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message" style="margin-bottom: 1rem; color: #ef4444; background: rgba(239, 68, 68, 0.12); padding: 10px; border-radius: 6px; text-align: center; font-size: 14px;">
      {{ error }}
    </div>

    <!-- Form -->
    <form class="login-form" (ngSubmit)="onSubmit()" autocomplete="on">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrapper">
          <span class="input-icon"><lucide-icon name="user" [size]="16"></lucide-icon></span>
          <input
            type="text"
            class="form-input with-icon"
            placeholder="Username"
            name="username"
            [(ngModel)]="credentials.username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrapper">
          <span class="input-icon"><lucide-icon name="lock" [size]="16"></lucide-icon></span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-input with-icon with-icon-right"
            placeholder="Password"
            name="password"
            [(ngModel)]="credentials.password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="input-icon-right"
            style="background: transparent; border: none; cursor: pointer; color: var(--text-muted);"
            (click)="togglePassword()"
            tabindex="-1"
          >
            <lucide-icon *ngIf="showPassword" name="eye-off" [size]="16"></lucide-icon>
            <lucide-icon *ngIf="!showPassword" name="eye" [size]="16"></lucide-icon>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-lg w-full"
        [disabled]="isLoading"
      >
        <ng-container *ngIf="isLoading">
          <span class="spinner"></span>
          Logging In...
        </ng-container>
        <ng-container *ngIf="!isLoading">
          Sign In
        </ng-container>
      </button>
    </form>

    <!-- Footer -->
    <p class="login-footer">
      © 2026 InvManager · All rights reserved
    </p>
  </div>
</div>
