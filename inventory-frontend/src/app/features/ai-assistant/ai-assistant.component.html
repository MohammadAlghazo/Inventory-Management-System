<div class="h-full flex flex-col bg-base-100 rounded-box shadow-sm border border-base-content/10 overflow-hidden" style="height: calc(100vh - 120px);">
  <!-- Header -->
  <div class="bg-primary text-primary-content p-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="avatar placeholder">
        <div class="bg-primary-focus text-primary-content rounded-full w-10">
          <i class="fa-solid fa-robot text-xl"></i>
        </div>
      </div>
      <div>
        <h3 class="font-bold text-lg leading-tight">Inventory-AI</h3>
        <p class="text-xs opacity-80">Online & Ready</p>
      </div>
    </div>
    
    <!-- Mode Selector & Controls -->
    <div class="flex items-center gap-4">
      <div class="join bg-base-200 p-1 rounded-box hidden sm:flex">
        <button
          class="btn join-item btn-sm"
          [class.btn-active]="aiMode === 0"
          (click)="setAiMode(0)"
        >
          <i class="fa-solid fa-bolt text-warning"></i> Fast
        </button>
        <button
          class="btn join-item btn-sm"
          [class.btn-active]="aiMode === 1"
          (click)="setAiMode(1)"
          title="Database Access & Advanced Analysis"
        >
          <i class="fa-solid fa-brain text-secondary"></i> Deep Think
        </button>
      </div>

      <button class="btn btn-ghost btn-sm btn-circle" (click)="clearChat()" title="Clear Chat">
        <i class="fa-solid fa-trash opacity-70"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Mode Selector -->
  <div class="bg-base-200 p-2 flex justify-center border-b border-base-content/10 sm:hidden">
    <div class="join w-full">
      <button
        class="btn join-item btn-sm flex-1"
        [class.btn-active]="aiMode === 0"
        (click)="setAiMode(0)"
      >
        <i class="fa-solid fa-bolt text-warning"></i> Fast
      </button>
      <button
        class="btn join-item btn-sm flex-1"
        [class.btn-active]="aiMode === 1"
        (click)="setAiMode(1)"
      >
        <i class="fa-solid fa-brain text-secondary"></i> Deep Think
      </button>
    </div>
  </div>

  <!-- Chat Messages Container -->
  <div
    class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6"
    #messagesContainer
    style="background-color: var(--fallback-b2,oklch(var(--b2)/0.3));"
  >
    <div
      *ngFor="let msg of messages; let i = index"
      class="chat"
      [ngClass]="msg.role === 'user' ? 'chat-end' : 'chat-start'"
    >
      <div class="chat-image avatar">
        <div class="w-10 rounded-full shadow-sm" [ngClass]="msg.role === 'user' ? 'bg-secondary' : 'bg-primary'">
          <div class="w-full h-full flex items-center justify-center text-white text-sm">
            <i [class]="msg.role === 'user' ? 'fa-solid fa-user' : 'fa-solid fa-robot'"></i>
          </div>
        </div>
      </div>
      
      <div class="chat-header opacity-50 text-xs mb-1 font-medium">
        {{ msg.role === 'user' ? 'You' : 'Inventory-AI' }}
        <time class="text-xs opacity-50 ml-2 font-normal">{{ msg.timestamp | date:'shortTime' }}</time>
      </div>

      <div
        class="chat-bubble shadow-md text-sm md:text-base whitespace-pre-wrap max-w-[85%] md:max-w-[75%]"
        [ngClass]="{
          'chat-bubble-primary text-primary-content': msg.role === 'assistant',
          'chat-bubble-secondary text-secondary-content': msg.role === 'user'
        }"
      >
        <ng-container *ngIf="!msg.loading; else loadingTpl">
          <div [innerHTML]="formatContent(msg.content)" class="leading-relaxed"></div>
        </ng-container>
        <ng-template #loadingTpl>
          <span class="loading loading-dots loading-md"></span>
        </ng-template>
      </div>
      
      <div class="chat-footer opacity-50 flex gap-2 mt-1" *ngIf="msg.tokens && msg.role === 'assistant'">
        <span class="text-[11px]"><i class="fa-solid fa-coins mr-1"></i>{{ msg.tokens }} tokens</span>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="p-4 bg-base-100 border-t border-base-content/10">
    <div class="max-w-4xl mx-auto relative">
      <div class="join w-full shadow-sm">
        <input
          type="text"
          [(ngModel)]="userInput"
          (keydown)="onKeydown($event)"
          [disabled]="isLoading"
          placeholder="Ask Inventory-AI anything..."
          class="input input-bordered input-lg join-item w-full focus:outline-none"
        />
        <button
          class="btn btn-primary btn-lg join-item px-8"
          (click)="sendMessage()"
          [disabled]="!canSend"
        >
          <i class="fa-solid fa-paper-plane text-lg" *ngIf="!isLoading"></i>
          <span class="loading loading-spinner loading-md" *ngIf="isLoading"></span>
        </button>
      </div>
      <div class="text-center mt-3 opacity-50 text-xs font-medium">
        Inventory-AI is an advanced assistant and can make mistakes. Please verify important information.
      </div>
    </div>
  </div>
</div>
