<div class="ai-page-container" [class.deep-think-mode]="aiMode === 1">
  <!-- Header -->
  <header class="ai-header">
    <div class="header-left">
      <div class="ai-avatar">
        <img src="assets/logo.jpg" alt="Logo">
        <div class="online-dot"></div>
      </div>
      <div class="header-titles">
        <h2>Inventory Ai</h2>
        <p>Your Ai assistant</p>
      </div>
    </div>
    <div class="header-right">
      <button class="clear-btn" (click)="clearChat()" title="Clear Chat">
        <lucide-icon name="trash-2" [size]="16"></lucide-icon>
      </button>
    </div>
  </header>

  <!-- Chat Area -->
  <main class="ai-chat-area" #messagesContainer>
    <div class="chat-background"></div>
    
    <div class="messages-list">
      <div *ngFor="let msg of messages; let i = index" class="message-row" [ngClass]="msg.role">
        
        <!-- Assistant Avatar -->
        <div *ngIf="msg.role === 'assistant'" class="ai-avatar-small">
          <img src="assets/logo.jpg" alt="AI">
        </div>

        <div class="message-content">
          <div class="text-bubble" [ngClass]="msg.role">
            <ng-container *ngIf="!msg.loading; else loadingTpl">
              <div [innerHTML]="formatContent(msg.content)"></div>
            </ng-container>
            <ng-template #loadingTpl>
              <div class="typing-indicator">
                <span></span><span></span><span></span>
              </div>
            </ng-template>
          </div>
          
          <div class="message-meta" [ngClass]="msg.role">
            <span class="time">{{ msg.timestamp | date:'hh:mm a' }}</span>
            <span *ngIf="msg.tokens && msg.role === 'assistant'" class="tokens">
              <lucide-icon name="zap" [size]="12"></lucide-icon> {{ msg.tokens }} tokens
            </span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer Input Area -->
  <footer class="ai-footer">
    <div class="input-container-wrapper">
      
      <!-- Mode Selector -->
      <div class="mode-selector">
        <button 
          class="mode-btn" 
          [class.active]="aiMode === 0" 
          (click)="setAiMode(0)">
          <lucide-icon name="zap" [size]="14"></lucide-icon> Normal
        </button>
        <button 
          class="mode-btn" 
          [class.active]="aiMode === 1" 
          (click)="setAiMode(1)">
          <lucide-icon name="brain" [size]="14"></lucide-icon> Deep Think
        </button>
      </div>

      <!-- Main Input Box -->
      <div class="input-box">
        <textarea
          [(ngModel)]="userInput"
          (keydown)="onKeydown($event)"
          [disabled]="isLoading"
          placeholder="Ask me anything about inventory, products, orders..."
          rows="1"
          maxlength="250"
        ></textarea>
        
        <div class="input-bottom-row">
          <span class="char-counter">{{ userInput.length }}/250</span>
          <button 
            class="send-btn" 
            [class.active]="canSend"
            (click)="sendMessage()"
            [disabled]="!canSend"
          >
            <lucide-icon name="send" [size]="16" *ngIf="!isLoading"></lucide-icon>
            <span class="loading-spinner" *ngIf="isLoading">
              <lucide-icon name="loader" [size]="16" class="spin"></lucide-icon>
            </span>
          </button>
        </div>
      </div>

    </div>
  </footer>
</div>
