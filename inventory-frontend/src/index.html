<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StockMaster - Enterprise ERP</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c84b2a">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;family=Sora:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <app-root>
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #100c0a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999;">
      <img src="assets/logo.jpg" style="width: 120px; height: 120px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);" />
      <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #c84b2a; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
        body { margin: 0; background: #100c0a; }
      </style>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
